name: Verify and extract Mazraa Agent ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.build/extract-once']
permissions:
  contents: read
concurrency:
  group: mazraa-agent-single-apk
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record actual source commit
        run: |
          mkdir -p build/build-info
          git rev-parse HEAD > build/build-info/SOURCE_COMMIT.txt
      - name: Select installed Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Restore cached Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Restore Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mazraa-agent-development-signing-v1
      - name: Prepare Android wrapper if missing
        run: bash tool/prepare_android.sh
      - name: Resolve dependencies once
        run: |
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi
      - name: Validate architecture and all screen contracts
        run: |
          python3 tool/check_structure.py
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Build one compact ARM64 release APK
        run: |
          flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/agent-symbols
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          sha256sum "$apk" > build/build-info/SHA256.txt
          stat -c '%s' "$apk" > build/build-info/SIZE_BYTES.txt
          {
            echo '### Mazraa Agent ARM64'
            echo "Source: $(cat build/build-info/SOURCE_COMMIT.txt)"
            echo "APK bytes: $(stat -c '%s' "$apk")"
            echo 'One ABI, release optimizations, cached Flutter/Pub/Gradle; Firebase setup is not required.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-agent-arm64
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/build-info/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload UI previews and crash symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazraa-agent-verification
          path: |
            build/previews/
            build/agent-symbols/
            pubspec.lock
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            lib/
            test/
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14
